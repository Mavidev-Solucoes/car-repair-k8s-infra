name: Platform

# Sobe no namespace car-repair as dependências dos microsserviços (um Postgres por serviço, MongoDB e RabbitMQ).
# Rodar uma vez por sessão do AWS Academy, depois do Terraform e antes do CD dos serviços.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-academy
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap da plataforma no EKS (AWS Academy)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'car-repair-dev' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar sessão do AWS Academy
        shell: bash
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || ! aws sts get-caller-identity >/dev/null 2>&1; then
            echo "::error::Credenciais do AWS Academy ausentes ou expiradas. Rode scripts/academy-github-credentials.sh."
            exit 1
          fi

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Subir bancos e RabbitMQ
        run: scripts/academy-bootstrap-platform.sh
