# Postgres exclusivo do billing-service: nenhum outro serviço tem credencial para este banco.
# No AWS Academy o cluster é recriado a cada sessão e não há driver EBS, por isso o dado fica em emptyDir.
# Em produção, trocar por volumeClaimTemplates (gp3) ou por um RDS dedicado.
apiVersion: v1
kind: Service
metadata:
  name: billing-postgres
  labels:
    app.kubernetes.io/name: billing-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: car-repair
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: billing-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-postgres
  labels:
    app.kubernetes.io/name: billing-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: car-repair
spec:
  serviceName: billing-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: car-repair
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: car_repair_billing
            - name: POSTGRES_USER
              value: billing
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "billing", "-d", "car_repair_billing"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "billing", "-d", "car_repair_billing"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
