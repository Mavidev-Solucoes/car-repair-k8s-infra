apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dependências dos microsserviços da fase 4. As credenciais (Secrets) são criadas antes por
# scripts/academy-bootstrap-platform.sh, que gera senhas aleatórias e nunca as grava no repositório.
namespace: car-repair

resources:
  - namespace.yaml
  - rabbitmq.yaml
  - production-mongodb.yaml
  - postgres-os.yaml
  - postgres-billing.yaml
  - postgres-saga.yaml
